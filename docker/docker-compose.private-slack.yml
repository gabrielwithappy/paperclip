# Private board + public Slack webhook through an existing host Cloudflare Tunnel.
# See doc/DOCKER.md for setup and migration notes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?Set PAPERCLIP_DB_PASSWORD to a stable hex value}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    pids_limit: 2048
    stop_grace_period: 90s
    ports:
      - "${PAPERCLIP_BOARD_PORT:-3110}:3100"
    environment:
      DATABASE_URL: postgres://paperclip:${PAPERCLIP_DB_PASSWORD:?Set PAPERCLIP_DB_PASSWORD to a stable hex value}@db:5432/paperclip
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      TZ: Asia/Seoul
      GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND: file
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_BIND: lan
      PAPERCLIP_AUTH_BASE_URL_MODE: explicit
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?Set the private HTTPS board origin}
      # Agent runtimes use this Docker-reachable API origin, not the browser-facing Tailscale URL.
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:?Set the Docker-reachable Paperclip API origin}
      PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL: ${PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL:?Set the public HTTPS Slack callback origin}
      # Include the callback hostname; private hostname admission also applies to webhooks.
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:?Include the callback hostname}
      # Also admit direct loopback access to the board for local setup.
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:${PAPERCLIP_BOARD_PORT:-3110},http://127.0.0.1:${PAPERCLIP_BOARD_PORT:-3110}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a stable session secret}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set an independent stable signing secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  slack-callback:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${PAPERCLIP_CALLBACK_PORT:-3111}:8080"
    volumes:
      - ./slack-callback/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  paperclip-data:
